<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430">
  <defs>
    <filter id="dlgShadow" x="-4%" y="-4%" width="110%" height="112%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.20" />
    </filter>
    <linearGradient id="dlgTitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <style>
      .ui { font-family: 'Yu Gothic UI', 'Meiryo UI', 'Segoe UI', sans-serif; }
      .mono { font-family: 'Consolas', 'BIZ UDGothic', 'MS Gothic', monospace; }
      .badge-circle { fill: #E8590C; stroke: #FFFFFF; stroke-width: 2; }
      .badge-num { font-family: 'Segoe UI', 'Yu Gothic UI', sans-serif; font-size: 12.5px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; dominant-baseline: central; }
      .lbl { font-family: 'Yu Gothic UI', 'Meiryo UI', sans-serif; font-size: 12.5px; font-weight: 600; fill: #1E293B; }
      .input-box { fill: #FFFFFF; stroke: #94A3B8; stroke-width: 1.2; rx: 3; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.2; rx: 8; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="960" height="430" fill="#F8FAFC" rx="10" />
  <text x="24" y="28" class="ui" font-size="14" font-weight="700" fill="#0F172A">図 2 : 「仮想シリアルペア設定」ダイアログの構成と中継モード別入力ガイド</text>

  <!-- 左側: PairEditDialog 本体 -->
  <g filter="url(#dlgShadow)">
    <rect x="28" y="48" width="468" height="352" rx="7" fill="#F3F4F6" stroke="#94A3B8" stroke-width="1.5" />
    <path d="M 28 55 Q 28 48 35 48 L 489 48 Q 496 48 496 55 L 496 80 L 28 80 Z" fill="url(#dlgTitle)" />
  </g>
  <text x="44" y="69" class="ui" font-size="13" font-weight="700" fill="#FFFFFF">仮想シリアルペア設定</text>
  <g stroke="#E2E8F0" stroke-width="1.5">
    <line x1="471" y1="59" x2="481" y2="69" />
    <line x1="481" y1="59" x2="471" y2="69" />
  </g>

  <!-- ① 仮想ポート A -->
  <circle cx="48" cy="108" r="10.5" class="badge-circle" />
  <text x="48" y="108" class="badge-num">1</text>
  <text x="66" y="113" class="lbl">仮想ポート A:</text>
  <rect x="192" y="94" width="284" height="28" class="input-box" />
  <text x="202" y="113" class="mono" font-size="13" font-weight="700" fill="#0F172A">COM10</text>

  <!-- ② 中継モード -->
  <circle cx="48" cy="148" r="10.5" class="badge-circle" />
  <text x="48" y="148" class="badge-num">2</text>
  <text x="66" y="153" class="lbl">中継モード:</text>
  <rect x="192" y="134" width="284" height="28" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" rx="3" />
  <text x="202" y="153" class="mono" font-size="13" font-weight="700" fill="#1D4ED8">VirtualPort</text>
  <rect x="450" y="135" width="25" height="26" fill="#EFF6FF" rx="2" />
  <path d="M 458 145 L 462.5 151 L 467 145" stroke="#1D4ED8" stroke-width="1.8" fill="none" stroke-linecap="round" />

  <!-- ③ ポート B / 接続先 -->
  <circle cx="48" cy="188" r="10.5" class="badge-circle" />
  <text x="48" y="188" class="badge-num">3</text>
  <text x="66" y="193" class="lbl">ポート B / 接続先:</text>
  <rect x="192" y="174" width="284" height="28" class="input-box" />
  <text x="202" y="193" class="mono" font-size="13" font-weight="700" fill="#0F172A">COM11</text>

  <!-- ④ ボーレート伝送遅延を再現 (EmuBR) -->
  <circle cx="172" cy="230" r="10.5" class="badge-circle" />
  <text x="172" y="230" class="badge-num">4</text>
  <rect x="192" y="222" width="16" height="16" rx="2.5" fill="#FFFFFF" stroke="#64748B" stroke-width="1.4" />
  <text x="216" y="235" class="ui" font-size="12.5" fill="#1E293B">ボーレート伝送遅延を再現 (EmuBR)</text>

  <!-- ⑤ DTR/DSR・RTS/CTS 制御線をクロス結線 -->
  <circle cx="172" cy="264" r="10.5" class="badge-circle" />
  <text x="172" y="264" class="badge-num">5</text>
  <rect x="192" y="256" width="16" height="16" rx="2.5" fill="#2563EB" stroke="#1D4ED8" stroke-width="1.4" />
  <path d="M 195.5 264 L 199 267.5 L 205 260" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <text x="216" y="269" class="ui" font-size="12.5" fill="#1E293B">DTR/DSR・RTS/CTS 制御線をクロス結線</text>

  <!-- ⑥ このペアを有効にする -->
  <circle cx="172" cy="298" r="10.5" class="badge-circle" />
  <text x="172" y="298" class="badge-num">6</text>
  <rect x="192" y="290" width="16" height="16" rx="2.5" fill="#2563EB" stroke="#1D4ED8" stroke-width="1.4" />
  <path d="M 195.5 298 L 199 301.5 L 205 294" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <text x="216" y="303" class="ui" font-size="12.5" font-weight="600" fill="#1E293B">このペアを有効にする</text>

  <!-- ⑦ OK / キャンセルボタン -->
  <circle cx="258" cy="358" r="10.5" class="badge-circle" />
  <text x="258" y="358" class="badge-num">7</text>

  <rect x="280" y="343" width="94" height="32" rx="4" fill="#2563EB" stroke="#1D4ED8" stroke-width="1.2" />
  <text x="327" y="364" class="ui" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">OK</text>

  <rect x="382" y="343" width="94" height="32" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" />
  <text x="429" y="364" class="ui" font-size="12.5" font-weight="600" fill="#1E293B" text-anchor="middle">キャンセル</text>

  <!-- 接続矢印 (② 中継モード -> 右側ガイド) -->
  <path d="M 480 148 L 522 148" stroke="#2563EB" stroke-width="2" stroke-dasharray="4,3" />
  <polygon points="522,143 532,148 522,153" fill="#2563EB" />

  <!-- 右側: 中継モード別「ポート B / 接続先」書式ガイドパネル -->
  <rect x="534" y="48" width="402" height="352" class="card" />
  <rect x="534" y="48" width="402" height="36" rx="8" fill="#EFF6FF" />
  <rect x="534" y="72" width="402" height="12" fill="#EFF6FF" />
  <line x1="534" y1="84" x2="936" y2="84" stroke="#BFDBFE" stroke-width="1.2" />
  <text x="550" y="71" class="ui" font-size="13" font-weight="700" fill="#1E3A8A">②「中継モード」選択肢と ③「ポート B / 接続先」書式</text>

  <!-- モード 1: VirtualPort -->
  <rect x="548" y="96" width="374" height="66" rx="6" fill="#F8FAFC" stroke="#BFDBFE" stroke-width="1.2" />
  <rect x="558" y="104" width="96" height="20" rx="4" fill="#DBEAFE" />
  <text x="606" y="118" class="mono" font-size="11.5" font-weight="700" fill="#1E40AF" text-anchor="middle">VirtualPort</text>
  <text x="664" y="118" class="ui" font-size="12" font-weight="700" fill="#0F172A">仮想 COM ペア（標準ヌルモデム）</text>
  <text x="558" y="138" class="ui" font-size="11.5" fill="#334155">入力例 : </text>
  <text x="608" y="138" class="mono" font-size="11.5" font-weight="700" fill="#0F172A">COM11 , COM21 , CNCB0</text>
  <text x="558" y="154" class="ui" font-size="11" fill="#64748B">用途 : PC 内の 2 つのアプリ間で折り返し双方向シリアル通信</text>

  <!-- モード 2: TcpServer -->
  <rect x="548" y="170" width="374" height="66" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
  <rect x="558" y="178" width="96" height="20" rx="4" fill="#E0F2FE" />
  <text x="606" y="192" class="mono" font-size="11.5" font-weight="700" fill="#0369A1" text-anchor="middle">TcpServer</text>
  <text x="664" y="192" class="ui" font-size="12" font-weight="700" fill="#0F172A">TCP サーバーブリッジ（着信待受）</text>
  <text x="558" y="212" class="ui" font-size="11.5" fill="#334155">入力例 : </text>
  <text x="608" y="212" class="mono" font-size="11.5" font-weight="700" fill="#0F172A">7000 , 127.0.0.1:7000 , 0.0.0.0:7000</text>
  <text x="558" y="228" class="ui" font-size="11" fill="#64748B">用途 : 外部ソケットからの着信を待ち受けて仮想 COM へ変換</text>

  <!-- モード 3: TcpClient -->
  <rect x="548" y="244" width="374" height="66" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
  <rect x="558" y="252" width="96" height="20" rx="4" fill="#EDE9FE" />
  <text x="606" y="266" class="mono" font-size="11.5" font-weight="700" fill="#6D28D9" text-anchor="middle">TcpClient</text>
  <text x="664" y="266" class="ui" font-size="12" font-weight="700" fill="#0F172A">TCP クライアントブリッジ（発信接続）</text>
  <text x="558" y="286" class="ui" font-size="11.5" fill="#334155">入力例 : </text>
  <text x="608" y="286" class="mono" font-size="11.5" font-weight="700" fill="#0F172A">127.0.0.1:5000 , 192.168.1.50:4001</text>
  <text x="558" y="302" class="ui" font-size="11" fill="#64748B">用途 : 外部シミュレータ・Ethernet-シリアル変換器へ自動接続</text>

  <!-- モード 4: PhysicalSerial -->
  <rect x="548" y="318" width="374" height="70" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
  <rect x="558" y="326" width="110" height="20" rx="4" fill="#FEF3C7" />
  <text x="613" y="340" class="mono" font-size="11.5" font-weight="700" fill="#B45309" text-anchor="middle">PhysicalSerial</text>
  <text x="676" y="340" class="ui" font-size="12" font-weight="700" fill="#0F172A">物理シリアル中継（実機スニファ）</text>
  <text x="558" y="360" class="ui" font-size="11.5" fill="#334155">入力例 : </text>
  <text x="608" y="360" class="mono" font-size="11.5" font-weight="700" fill="#0F172A">COM1 , COM3:9600 , COM4:115200</text>
  <text x="558" y="378" class="ui" font-size="11" fill="#64748B">用途 : 実機 COM との間に挟んで送受信電文をモニター可視化</text>
</svg>
