  <text x="60" y="309" class="mono" font-size="12.5" font-weight="700" fill="#1D4ED8">COM10</text>
  <polygon points="232,302 240,302 236,308" fill="#475569" />
  <rect x="252" y="292" width="56" height="26" rx="3" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2" />
  <text x="280" y="309" class="ui" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="middle">適用</text>

  <rect x="50" y="330" width="15" height="15" rx="2" fill="#2563EB" />
  <path d="M 53 337 L 56 340 L 62 333" stroke="#FFFFFF" stroke-width="1.8" fill="none" />
  <text x="71" y="342" class="ui" font-size="11" fill="#1E293B">ボーレート伝送遅延を再現 (EmuBR)</text>

  <text x="50" y="372" class="ui" font-size="11" fill="#334155">通信遅延エミュレーション (ms):</text>
  <rect x="228" y="357" width="80" height="22" class="input-box" />
  <text x="268" y="372" class="mono" font-size="11.5" fill="#0F172A" text-anchor="middle">0</text>

  <rect x="50" y="392" width="258" height="42" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
  <text x="58" y="408" class="mono" font-size="10.5" fill="#334155">条件: 9600 bps, 8-N-1</text>
  <text x="58" y="425" class="mono" font-size="10" font-weight="700" fill="#0F766E">出力[DTR:ON RTS:ON] 入力[CTS:ON DSR:ON DCD:--]</text>

