  <rect x="328" y="188" width="364" height="256" class="pane-card" />
  <path d="M 328 194 Q 328 188 334 188 L 686 188 Q 692 188 692 194 L 692 216 L 328 216 Z" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1" />
  <circle cx="342" cy="202" r="9" class="badge-circle" />
  <text x="342" y="202" class="badge-num">4</text>
  <text x="358" y="206" class="ui" font-size="12.5" font-weight="700" fill="#92400E">結線状況指定（8ピン仮想ケーブル）</text>

  <text x="338" y="235" class="ui" font-size="10.5" font-weight="600" fill="#475569">結線:</text>
  <rect x="372" y="221" width="244" height="22" class="input-box" />
  <text x="380" y="236" class="ui" font-size="11" font-weight="700" fill="#0F172A">折り返しクロス (Loopback)</text>
  <polygon points="602,230 609,230 605.5,235" fill="#475569" />
  <rect x="622" y="221" width="60" height="22" class="btn-box" />
  <text x="652" y="236" class="ui" font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle">全解除</text>

  <rect x="338" y="248" width="344" height="170" rx="5" fill="#FEFCE8" stroke="#E5E7EB" stroke-width="1.2" />
  <rect x="404" y="254" width="34" height="158" rx="10" fill="#FFFFFF" stroke="#111827" stroke-width="1.7" />
  <rect x="582" y="254" width="34" height="158" rx="10" fill="#FFFFFF" stroke="#111827" stroke-width="1.7" />

