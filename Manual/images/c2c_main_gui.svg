  <rect x="914" y="292" width="56" height="26" rx="3" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.2" />
  <text x="942" y="309" class="ui" font-size="11" font-weight="700" fill="#15803D" text-anchor="middle">適用</text>

  <text x="712" y="340" class="ui" font-size="10.5" fill="#475569">・仮想COM公開 / 物理シリアル接続 (COMx)</text>
  <text x="712" y="358" class="ui" font-size="10.5" fill="#475569">・TCP サーバー待受 / TCP クライアント接続</text>
  <text x="712" y="376" class="ui" font-size="10.5" fill="#475569">・UDP 待受・送受信 / 単一ポート折り返し</text>

