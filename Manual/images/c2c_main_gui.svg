  <text x="394" y="267" class="pin-lbl" text-anchor="end">TXD</text><circle cx="421" cy="267" r="5" class="pin-dot-data" />
  <text x="394" y="286" class="pin-lbl" text-anchor="end">RXD</text><circle cx="421" cy="286" r="5" class="pin-dot-data" />
  <text x="394" y="305" class="pin-lbl" text-anchor="end">RTS</text><circle cx="421" cy="305" r="5" class="pin-dot-on" />
  <text x="394" y="324" class="pin-lbl" text-anchor="end">CTS</text><circle cx="421" cy="324" r="5" class="pin-dot-on" />
  <text x="394" y="343" class="pin-lbl" text-anchor="end">DSR</text><circle cx="421" cy="343" r="5" class="pin-dot-on" />
  <text x="394" y="362" class="pin-lbl" text-anchor="end">S G</text><circle cx="421" cy="362" r="5" class="pin-dot" />
  <text x="394" y="381" class="pin-lbl" text-anchor="end">DCD</text><circle cx="421" cy="381" r="5" class="pin-dot" />
  <text x="394" y="400" class="pin-lbl" text-anchor="end">DTR</text><circle cx="421" cy="400" r="5" class="pin-dot-on" />

  <!-- B側 8 ピン -->
  <circle cx="599" cy="267" r="5" class="pin-dot-data" /><text x="626" y="267" class="pin-lbl">TXD</text>
  <circle cx="599" cy="286" r="5" class="pin-dot-data" /><text x="626" y="286" class="pin-lbl">RXD</text>
  <circle cx="599" cy="305" r="5" class="pin-dot-on" /><text x="626" y="305" class="pin-lbl">RTS</text>
  <circle cx="599" cy="324" r="5" class="pin-dot-on" /><text x="626" y="324" class="pin-lbl">CTS</text>
  <circle cx="599" cy="343" r="5" class="pin-dot-on" /><text x="626" y="343" class="pin-lbl">DSR</text>
  <circle cx="599" cy="362" r="5" class="pin-dot" /><text x="626" y="362" class="pin-lbl">S G</text>
  <circle cx="599" cy="381" r="5" class="pin-dot" /><text x="626" y="381" class="pin-lbl">DCD</text>
  <circle cx="599" cy="400" r="5" class="pin-dot-on" /><text x="626" y="400" class="pin-lbl">DTR</text>

  <text x="510" y="434" class="ui" font-size="10" fill="#475569" text-anchor="middle">左クリック2点で個別結線 ／ 右クリックで結線解除</text>

  <!-- ⑤ 【右ペイン】Bポート選択（右側コネクタ） -->
  <rect x="700" y="188" width="282" height="256" class="pane-card" />
  <path d="M 700 194 Q 700 188 706 188 L 976 188 Q 982 188 982 194 L 982 216 L 700 216 Z" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1" />
  <circle cx="714" cy="202" r="9" class="badge-circle" />
  <text x="714" y="202" class="badge-num">5</text>
  <text x="730" y="206" class="ui" font-size="12.5" font-weight="700" fill="#166534">Bポート選択（右側コネクタ）</text>

  <text x="712" y="236" class="ui" font-size="11" font-weight="600" fill="#334155">エンドポイント種別:</text>
  <rect x="712" y="242" width="258" height="26" class="input-box" />
  <text x="722" y="259" class="ui" font-size="11.5" font-weight="600" fill="#0F172A">仮想 COM ポート公開 (c2c)</text>
