<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="720" viewBox="0 0 1020 720">
  <defs>
    <filter id="winShadow" x="-3%" y="-3%" width="106%" height="108%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.18" />
    </filter>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="60%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="toolGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EEF2F6" />
    </linearGradient>
    <style>
      .ui { font-family: 'Yu Gothic UI', 'Meiryo UI', 'Segoe UI', sans-serif; }
      .mono { font-family: 'Consolas', 'BIZ UDGothic', 'MS Gothic', monospace; }
      .badge-circle { fill: #E8590C; stroke: #FFFFFF; stroke-width: 2; }
      .badge-num { font-family: 'Segoe UI', 'Yu Gothic UI', sans-serif; font-size: 12px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; dominant-baseline: central; }
      .btn-box { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.1; rx: 4; }
      .pane-card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.2; rx: 6; }
      .input-box { fill: #FFFFFF; stroke: #94A3B8; stroke-width: 1.1; rx: 3; }
      .grid-hdr { fill: #F1F5F9; stroke: #CBD5E1; stroke-width: 1; }
      .grid-hdr-txt { font-family: 'Yu Gothic UI', 'Meiryo UI', sans-serif; font-size: 11px; font-weight: 700; fill: #1E293B; }
      .pin-lbl { font-family: 'Segoe UI', 'Consolas', sans-serif; font-size: 13px; font-weight: 700; fill: #111827; dominant-baseline: central; }
      .pin-dot { fill: #BDBDBD; stroke: #1E293B; stroke-width: 1.5; }
      .pin-dot-on { fill: #4ADE80; stroke: #15803D; stroke-width: 1.7; }
      .pin-dot-data { fill: #FDE68A; stroke: #B45309; stroke-width: 1.6; }
      .wire { fill: none; stroke: #C86D2D; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- 背景キャンバス -->
  <rect x="0" y="0" width="1020" height="720" fill="#F8FAFC" rx="10" />
  <text x="24" y="25" class="ui" font-size="13.5" font-weight="700" fill="#0F172A">図 1 : c2c メイン画面の構成イメージ（1接続＝1タブ管理・上段3分割［左:Aポート / 中央:8ピン結線状況 / 右:Bポート］・下段専用通信ログ）</text>

  <!-- メインウィンドウ外枠 -->
  <g filter="url(#winShadow)">
    <rect x="20" y="38" width="980" height="660" rx="8" fill="#F3F4F6" stroke="#94A3B8" stroke-width="1.5" />
    <path d="M 20 46 Q 20 38 28 38 L 992 38 Q 1000 38 1000 46 L 1000 68 L 20 68 Z" fill="url(#titleGrad)" />
  </g>

  <!-- タイトルバー -->
  <rect x="34" y="45" width="17" height="17" rx="4" fill="#38BDF8" stroke="#E0F2FE" stroke-width="1" />
  <path d="M 38 53.5 L 47 53.5 M 44 50 L 48 53.5 L 44 57" stroke="#0F172A" stroke-width="1.8" fill="none" stroke-linecap="round" />
  <text x="58" y="58" class="ui" font-size="12.5" font-weight="700" fill="#FFFFFF">Monaca c2c - 仮想シリアル・Ethernet ポート中継ブローカー</text>

  <!-- 最小化・最大化・閉じる -->
  <g stroke="#E2E8F0" stroke-width="1.4" fill="none">
    <line x1="910" y1="54" x2="922" y2="54" />
    <rect x="942" y="48" width="11" height="11" />
    <line x1="973" y1="48" x2="984" y2="59" />
    <line x1="984" y1="48" x2="973" y2="59" />
  </g>

  <!-- 上部メニューバー（ファイル / 設定［環境設定・エラー履歴］ / ヘルプ） -->
  <rect x="21" y="68" width="978" height="22" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
  <text x="34" y="83" class="ui" font-size="11" fill="#334155">ファイル(F)</text>
  <text x="106" y="83" class="ui" font-size="11" font-weight="700" fill="#1D4ED8">設定(S)</text>
  <text x="164" y="83" class="ui" font-size="11" font-weight="700" fill="#1D4ED8">ヘルプ(H)</text>
  <text x="234" y="83" class="ui" font-size="10" fill="#64748B">← 環境設定（言語切替）・エラー履歴・操作説明書・バージョン情報</text>

  <!-- 上部共通ツールバー -->
  <rect x="21" y="90" width="978" height="24" fill="url(#toolGrad)" stroke="#CBD5E1" stroke-width="1" />

  <!-- 全中継開始 / 全中継停止 -->
  <rect x="32" y="92" width="94" height="20" rx="3" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.1" />
  <text x="79" y="106" class="ui" font-size="11" font-weight="700" fill="#B91C1C" text-anchor="middle">全中継停止</text>

  <line x1="136" y1="93" x2="136" y2="111" stroke="#CBD5E1" stroke-width="1.2" />

  <!-- ① ＋ 接続追加ボタン -->
  <rect x="146" y="92" width="114" height="20" rx="3" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.3" />
  <text x="203" y="106" class="ui" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="middle">＋ 接続追加</text>
  <circle cx="264" cy="94" r="8.5" class="badge-circle" />
  <text x="264" y="94" class="badge-num">1</text>

  <text x="282" y="106" class="ui" font-size="10.5" fill="#475569">← 他タブの通信を切断せず、新しい接続タブを追加</text>

  <!-- 接続タブバー (1接続 = 1タブ) -->
  <path d="M 30 142 L 30 118 Q 30 113 35 113 L 222 113 Q 227 113 227 118 L 227 142 Z" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6" />
  <text x="42" y="132" class="ui" font-size="11.5" font-weight="700" fill="#1D4ED8">● 接続1: COM10 ⇔ COM11</text>

  <path d="M 231 142 L 231 120 Q 231 115 236 115 L 448 115 Q 453 115 453 120 L 453 142 Z" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1.2" />
  <text x="242" y="133" class="ui" font-size="11.5" font-weight="600" fill="#475569">● 接続2: COM12 ⇔ 127.0.0.1:5000</text>

  <path d="M 457 142 L 457 120 Q 457 115 462 115 L 690 115 Q 695 115 695 120 L 695 142 Z" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1.2" />
  <text x="468" y="133" class="ui" font-size="11.5" font-weight="600" fill="#64748B">○ 接続3: 127.0.0.1:5001 ⇔ 127.0.0.1:5002</text>

  <!-- タブページ外枠コンテナ -->
  <rect x="30" y="141" width="960" height="524" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4" />
  <line x1="31" y1="141" x2="226" y2="141" stroke="#FFFFFF" stroke-width="2.5" />

  <!-- ② タブ内ヘッダバー（有効化スイッチ・状態バッジ・右端「削除」ボタン） -->
  <rect x="38" y="148" width="944" height="34" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
  <rect x="48" y="154" width="18" height="18" rx="3" fill="#2563EB" />
  <path d="M 52 163 L 56 167 L 63 158" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" />
  <text x="73" y="168" class="ui" font-size="12" font-weight="700" fill="#0F172A">この接続を有効化</text>

  <rect x="210" y="154" width="218" height="22" rx="11" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1" />
  <text x="319" y="169" class="ui" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">● 通信中 (A:接続済 / B:接続済)</text>

  <rect x="884" y="151" width="88" height="28" rx="4" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.3" />
