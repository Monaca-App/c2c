<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="390" viewBox="0 0 980 390">
  <defs>
    <filter id="boxShadow" x="-3%" y="-3%" width="106%" height="110%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <style>
      .ui { font-family: 'Yu Gothic UI', 'Meiryo UI', 'Segoe UI', sans-serif; }
      .mono { font-family: 'Consolas', 'BIZ UDGothic', 'MS Gothic', monospace; }
      .step-pill { fill: #1D4ED8; }
      .step-txt { font-family: 'Yu Gothic UI', 'Meiryo UI', sans-serif; font-size: 12px; font-weight: 700; fill: #FFFFFF; }
    </style>
  </defs>

  <rect x="0" y="0" width="980" height="390" fill="#F8FAFC" rx="10" />
  <text x="24" y="28" class="ui" font-size="14" font-weight="700" fill="#0F172A">図 4 : TermAddIn（Excel）と c2c を組み合わせた実機なし折り返し通信テスト画面イメージ</text>

  <!-- ステップ 1 カード: c2c 仮想ペア公開 -->
  <g filter="url(#boxShadow)">
    <rect x="20" y="48" width="286" height="318" rx="8" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5" />
  </g>
  <rect x="20" y="48" width="286" height="34" rx="8" fill="#1E40AF" />
  <rect x="20" y="68" width="286" height="14" fill="#1E40AF" />
  <text x="34" y="70" class="step-txt">STEP 1 : c2c.exe を起動（ポート公開）</text>

  <text x="34" y="104" class="ui" font-size="11.5" fill="#334155">起動と同時に既定ペアが「待受中」になります</text>

  <!-- ミニ c2c グリッド -->
  <rect x="34" y="116" width="258" height="84" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
  <rect x="34" y="116" width="258" height="24" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
  <text x="44" y="132" class="ui" font-size="11" font-weight="700" fill="#1E293B">ポート A</text>
  <text x="116" y="132" class="ui" font-size="11" font-weight="700" fill="#1E293B">ポート B</text>
  <text x="204" y="132" class="ui" font-size="11" font-weight="700" fill="#1E293B">状態</text>

  <rect x="35" y="141" width="256" height="30" fill="#DBEAFE" />
  <text x="44" y="160" class="mono" font-size="12.5" font-weight="700" fill="#1E3A8A">COM10</text>
  <text x="98" y="160" class="mono" font-size="11" fill="#64748B">&lt;-&gt;</text>
  <text x="122" y="160" class="mono" font-size="12.5" font-weight="700" fill="#1E3A8A">COM11</text>
  <rect x="196" y="146" width="84" height="20" rx="10" fill="#DCFCE7" stroke="#22C55E" stroke-width="1" />
  <text x="238" y="160" class="ui" font-size="11" font-weight="700" fill="#15803D" text-anchor="middle">待受中/通信中</text>

  <text x="44" y="191" class="ui" font-size="10.5" fill="#64748B">※ ドライバ導入・管理者権限・再起動すべて不要</text>

  <!-- ミニモニター -->
  <rect x="34" y="212" width="258" height="138" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1" />
  <text x="44" y="232" class="ui" font-size="11" font-weight="700" fill="#38BDF8">リアルタイム通信モニター</text>
  <line x1="42" y1="239" x2="284" y2="239" stroke="#334155" stroke-width="1" />
  <text x="44" y="258" class="mono" font-size="11" fill="#93C5FD">COM10-&gt;COM11 : *IDN?\r\n</text>
  <text x="44" y="278" class="mono" font-size="11" fill="#86EFAC">COM11-&gt;COM10 : MONACA,OK\r\n</text>
  <text x="44" y="298" class="mono" font-size="11" fill="#93C5FD">COM10-&gt;COM11 : MEAS:VOLT?\r\n</text>
  <text x="44" y="318" class="mono" font-size="11" fill="#86EFAC">COM11-&gt;COM10 : +5.001\r\n</text>
  <text x="44" y="340" class="ui" font-size="10.5" fill="#FDE047">★ 送受信の両方向を 1 画面で同時可視化</text>

  <!-- 矢印 1 -> 2 -->
  <path d="M 308 175 L 340 175" stroke="#2563EB" stroke-width="2.5" />
  <polygon points="338,169 348,175 338,181" fill="#2563EB" />

  <!-- ステップ 2 カード: TermAddIn プロパティ設定画面 -->
  <g filter="url(#boxShadow)">
    <rect x="350" y="48" width="292" height="318" rx="8" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5" />
  </g>
  <rect x="350" y="48" width="292" height="34" rx="8" fill="#047857" />
  <rect x="350" y="68" width="292" height="14" fill="#047857" />
  <text x="364" y="70" class="step-txt">STEP 2 : TermAddIn で仮想ポートを選択</text>

  <text x="364" y="104" class="ui" font-size="11.5" fill="#334155">「プロパティ設定」のポート一覧に自動出現！</text>

  <!-- ミニ プロパティ設定ダイアログ -->
  <rect x="364" y="116" width="264" height="202" rx="5" fill="#F3F4F6" stroke="#94A3B8" stroke-width="1.2" />
  <rect x="364" y="116" width="264" height="24" rx="5" fill="#334155" />
  <text x="374" y="132" class="ui" font-size="11" font-weight="700" fill="#FFFFFF">プロパティ設定（COM / Modbus / Melco）</text>

  <text x="376" y="162" class="ui" font-size="11.5" font-weight="600" fill="#1E293B">ポート名:</text>
  <rect x="448" y="146" width="164" height="26" rx="3" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" />
  <text x="458" y="164" class="mono" font-size="12" font-weight="700" fill="#1D4ED8">COM10</text>
  <path d="M 596 156 L 600 162 L 604 156" stroke="#1D4ED8" stroke-width="1.6" fill="none" />

  <!-- ドロップダウン展開リスト -->
  <rect x="448" y="172" width="164" height="92" fill="#FFFFFF" stroke="#64748B" stroke-width="1.2" />
  <text x="458" y="190" class="mono" font-size="11.5" fill="#475569">COM1  (物理ポート)</text>
  <text x="458" y="210" class="mono" font-size="11.5" fill="#475569">COM3  (物理ポート)</text>
  <rect x="449" y="218" width="162" height="22" fill="#DBEAFE" />
  <text x="458" y="233" class="mono" font-size="11.5" font-weight="700" fill="#1E40AF">COM10 (c2c 仮想公開)</text>
  <text x="458" y="255" class="mono" font-size="11.5" font-weight="700" fill="#047857">COM11 (c2c 仮想公開)</text>

  <rect x="536" y="280" width="76" height="26" rx="3" fill="#047857" />
  <text x="574" y="297" class="ui" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">確定</text>

  <text x="364" y="342" class="ui" font-size="11" fill="#047857" font-weight="700">✓ 自然順（COM1, COM3, COM10, COM11）で自動整列</text>

  <!-- 矢印 2 -> 3 -->
  <path d="M 644 175 L 676 175" stroke="#047857" stroke-width="2.5" />
  <polygon points="674,169 684,175 674,181" fill="#047857" />

  <!-- ステップ 3 カード: Excel シーケンス & 対向シミュレータ実行 -->
  <g filter="url(#boxShadow)">
    <rect x="686" y="48" width="274" height="318" rx="8" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5" />
  </g>
  <rect x="686" y="48" width="274" height="34" rx="8" fill="#7C3AED" />
  <rect x="686" y="68" width="274" height="14" fill="#7C3AED" />
  <text x="700" y="70" class="step-txt">STEP 3 : シーケンス折り返し実行</text>

  <!-- Excel シート側 (COM10) -->
  <rect x="700" y="96" width="246" height="110" rx="5" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2" />
  <text x="710" y="115" class="ui" font-size="11.5" font-weight="700" fill="#166534">Excel シーケンスシート（COM10 接続）</text>
  <rect x="710" y="124" width="226" height="26" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1" />
  <rect x="714" y="128" width="44" height="18" rx="3" fill="#16A34A" />
  <text x="736" y="141" class="ui" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">実行</text>
  <text x="766" y="141" class="mono" font-size="11" fill="#0F172A">Com_Send "*IDN?"</text>

  <rect x="710" y="154" width="226" height="26" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1" />
  <text x="716" y="171" class="ui" font-size="10.5" font-weight="700" fill="#15803D">Result セル :</text>
  <text x="790" y="171" class="mono" font-size="11" font-weight="700" fill="#166534">MONACA,OK</text>
  <text x="710" y="197" class="ui" font-size="10.5" fill="#475569">本番シートを変更せずそのままテスト実行！</text>

  <!-- 双方向矢印 -->
  <path d="M 805 210 L 805 238 M 835 238 L 835 210" stroke="#7C3AED" stroke-width="2" />
  <polygon points="800,235 805,243 810,235" fill="#7C3AED" />
  <polygon points="830,213 835,205 840,213" fill="#7C3AED" />
  <text x="850" y="228" class="ui" font-size="10.5" font-weight="700" fill="#6D28D9">c2c 内部中継</text>

  <!-- 対向 Term P2 / シミュレータ側 (COM11) -->
  <rect x="700" y="246" width="246" height="104" rx="5" fill="#FAF5FF" stroke="#D8B4FE" stroke-width="1.2" />
  <text x="710" y="266" class="ui" font-size="11.5" font-weight="700" fill="#5B21B6">対向側 : 別タスク Term (/P2) 等（COM11）</text>
  <text x="710" y="288" class="ui" font-size="11" fill="#334155">・2 つ目の Term 画面で COM11 をオープン</text>
  <text x="710" y="308" class="ui" font-size="11" fill="#334155">・手動応答または疑似デバイス応答マクロを実行</text>
  <text x="710" y="328" class="ui" font-size="11" fill="#334155">・TCP ブリッジなら外部シミュレータとも直結！</text>
</svg>
